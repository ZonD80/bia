[package]
name = "bia-flash"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform USB stick writer for bia (GPT + ESP + BIAROOT + optional FMM keys and Hugging Face GGUF)"
default-run = "bia-flash"

[[bin]]
name = "bia-flash"
path = "src/main.rs"

[[bin]]
name = "bia-flash-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["eframe", "egui", "rfd"]

[dependencies]
bia-disk = { path = "../bia-disk" }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
fatfs = "0.3"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
ruzstd = "0.8"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
eframe = { version = "0.29", optional = true, default-features = true }
egui = { version = "0.29", optional = true }
# Native file dialog; on Linux via the XDG portal (no GTK build dependency).
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[build-dependencies]
winresource = "0.1"
