# Release bia: tools/release.sh on GitHub's runners. Each runner builds the packages of its
# own platform (--build-only), and one job publishes them all (--publish), so bia-os.json is
# merged once. A package the release already has is skipped, as with a local run.
# Every OS image carries the MCPs of both architectures: the mcps jobs build the agent and
# MCPs on each architecture's runner first, and both image jobs start from both sets.
#
# Starts on a pushed tag v<version> (the version in Cargo.toml), or by hand:
#   gh workflow run release.yml -f only=flashers -f force=true
#   gh workflow run release.yml -f publish=false     (test build: nothing is released)
#
# Secrets: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD (notarization), MACOS_CERT_P12 (base64 of
# the Developer ID Application identity as .p12) and MACOS_CERT_PASSWORD, BIA_TG_API_ID and
# BIA_TG_API_HASH (compiled into the Telegram MCP), ANDROID_KEYSTORE_B64 (base64 of
# ~/biaDeployPlayKeys.jks, the Play upload key) and ANDROID_KEYSTORE_PROPERTIES (its
# keystore.properties). The iOS app is published unsigned (no Apple secrets for it).
# Variables: APPLE_TEAM_ID, CODESIGN_IDENTITY.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Packages or groups (release.sh --only), e.g. flashers or os-arm64,flash-macos; empty: all"
        required: false
        default: ""
      force:
        description: "Rebuild even what the release has (release.sh --force)"
        type: boolean
        default: false
      publish:
        description: "Publish the release (off: a test build; the packages stay as run artifacts)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  ONLY: ${{ inputs.only }}
  FORCE: ${{ inputs.force && '--force' || '' }}

jobs:
  # agent + MCPs for one architecture; skipped when only apps are built
  mcps:
    if: ${{ !inputs.only || contains(inputs.only, 'os') || contains(inputs.only, 'land') }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            rarch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rarch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
      - name: Telegram app credentials (read by builders/build.sh from .env)
        env:
          TG_ID: ${{ secrets.BIA_TG_API_ID }}
          TG_HASH: ${{ secrets.BIA_TG_API_HASH }}
        run: |
          umask 077
          printf 'BIA_TG_API_ID=%s\nBIA_TG_API_HASH=%s\n' "$TG_ID" "$TG_HASH" > .env
      - name: Build agent and MCPs (${{ matrix.arch }})
        run: |
          make ARCH=${{ matrix.arch }} builder
          make ARCH=${{ matrix.arch }} rust
          make ARCH=${{ matrix.arch }} mcps
          sudo chown -R "$(id -u):$(id -g)" dist source/flash
      - name: Pack (a tar keeps the executable bits an artifact would drop)
        run: tar -czf mcps-${{ matrix.arch }}.tgz dist/${{ matrix.arch }} source/flash/MCPs/*/bin/${{ matrix.rarch }}
      - uses: actions/upload-artifact@v7
        with:
          name: mcps-${{ matrix.arch }}
          path: mcps-${{ matrix.arch }}.tgz
          retention-days: 3
      - name: Forget the credentials
        if: always()
        run: rm -f .env

  linux:
    needs: mcps
    if: ${{ !cancelled() && needs.mcps.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            within: os-x86_64,land-x86_64,flash-linux,flash-windows,takeover
          - runner: ubuntu-24.04-arm
            within: os-arm64,land-arm64,flash-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} is not v$v (Cargo.toml)"; exit 1; }
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h / | tail -1
      - name: Telegram app credentials (read by builders/build.sh from .env)
        env:
          TG_ID: ${{ secrets.BIA_TG_API_ID }}
          TG_HASH: ${{ secrets.BIA_TG_API_HASH }}
        run: |
          umask 077
          printf 'BIA_TG_API_ID=%s\nBIA_TG_API_HASH=%s\n' "$TG_ID" "$TG_HASH" > .env
      - name: Agent and MCPs of both architectures
        if: ${{ needs.mcps.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: mcps-*
          # outside the checkout: release.sh builds only from a clean tree
          path: ${{ runner.temp }}/mcps-dl
          merge-multiple: true
      - name: Build
        run: |
          if ls "$RUNNER_TEMP"/mcps-dl/*.tgz >/dev/null 2>&1; then
            for t in "$RUNNER_TEMP"/mcps-dl/*.tgz; do tar -xzf "$t"; done
            export BIA_PREBUILT=1
          fi
          tools/release.sh --build-only --within "${{ matrix.within }}" ${ONLY:+--only "$ONLY"} $FORCE
      - name: Hand the packages to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.runner }}
          path: |
            dist/release/*/*
            dist/release/*/.built-*
            !dist/release/*/.secrets
            !dist/release/*/bia-os.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Forget the credentials
        if: always()
        run: rm -f .env

  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust for Apple Silicon and Intel
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Signing identity into a keychain of its own
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/bia-signing.keychain-db"
          kp=$(openssl rand -hex 24)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # Developer ID certificates are issued by Apple's G2 intermediate, which a fresh
          # runner lacks: without it the identity does not verify and codesign cannot find it
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" -T /usr/bin/codesign
          security find-identity -p codesigning "$kc"
          if ! security find-identity -v -p codesigning "$kc" | grep -q 'Developer ID Application'; then
            echo "::error::no usable Developer ID Application identity in MACOS_CERT_P12: export it from Keychain Access under My Certificates (certificate with its private key) as .p12"
            exit 1
          fi
      - name: xz and create-dmg
        run: |
          command -v xz >/dev/null || brew install xz
          npm install -g create-dmg >/dev/null 2>&1 || true
      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
        run: tools/release.sh --build-only --within flash-macos ${ONLY:+--only "$ONLY"} $FORCE
      - uses: actions/upload-artifact@v7
        with:
          name: built-macos
          path: |
            dist/release/*/*
            dist/release/*/.built-*
            !dist/release/*/.secrets
            !dist/release/*/bia-os.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/bia-signing.keychain-db" 2>/dev/null || true

  # the phone apps: APK and app bundle on Linux (Play upload key), the IPA on macOS (unsigned)
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: NDK and cargo-ndk
        run: |
          ndk=$(sed -n 's/^NDK_VERSION="\${NDK_VERSION:-\(.*\)}"/\1/p' installers/android/build-common.sh)
          # yes ends on SIGPIPE, which pipefail would count: check the NDK instead
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null || true
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || { echo "::error::NDK $ndk did not install"; exit 1; }
          cargo install cargo-ndk --locked
      - name: Play upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_B64 is not set"; exit 1; }
          umask 077
          echo "$KEYSTORE_B64" | base64 --decode > "$HOME/biaDeployPlayKeys.jks"
          printf '%s\n' "$KEYSTORE_PROPERTIES" > installers/android/keystore.properties
      - name: Build
        run: tools/release.sh --build-only --within app-android ${ONLY:+--only "$ONLY"} $FORCE
      - uses: actions/upload-artifact@v7
        with:
          name: built-android
          path: |
            dist/release/*/*
            dist/release/*/.built-*
            !dist/release/*/.secrets
            !dist/release/*/bia-os.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Forget the key
        if: always()
        run: rm -f "$HOME/biaDeployPlayKeys.jks" installers/android/keystore.properties

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust for iOS, XcodeGen
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build
        run: tools/release.sh --build-only --within app-ios ${ONLY:+--only "$ONLY"} $FORCE
      - uses: actions/upload-artifact@v7
        with:
          name: built-ios
          path: |
            dist/release/*/*
            dist/release/*/.built-*
            !dist/release/*/.secrets
            !dist/release/*/bia-os.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: [linux, macos, android, ios]
    # what did build is published even when another runner failed (e.g. macOS signing
    # without its secrets); a later run builds only what is still missing
    # a pushed tag has no inputs (and null == false in these expressions): it always publishes
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: built-*
          path: dist/release
          merge-multiple: true
      - name: Anything built?
        id: any
        run: |
          if ls dist/release/*/.built-* >/dev/null 2>&1; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "nothing was built"; fi
      - name: Publish
        if: steps.any.outputs.go == '1'
        run: tools/release.sh --publish
