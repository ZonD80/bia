# Display :0 on a machine without any display device (cloud VMs such as EC2 or
# Graviton have no /dev/dri). bia-session falls back to this so x11vnc and the
# web display still show the console. kitty renders with Mesa llvmpipe; input
# comes through XTEST (VNC), so no input devices are configured.
Section "Device"
    Identifier "dummy"
    Driver "dummy"
    VideoRam 65536
EndSection

Section "Monitor"
    Identifier "virtual"
    HorizSync 5-1000
    VertRefresh 5-200
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125
EndSection

Section "Screen"
    Identifier "screen"
    Device "dummy"
    Monitor "virtual"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
    Option "AutoAddDevices" "false"
EndSection
