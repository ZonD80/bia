[package]
name = "bia-speech"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared on-device speech: sherpa-onnx STT/TTS, VAD, language detection, noise suppression, voice notes"

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Gradium Phonon (on-device streaming TTS, Rust runtime; models have their own licences)
ptts = { version = "0.7.1", default-features = false, features = ["hf"] }
xn = "0.2.14"
