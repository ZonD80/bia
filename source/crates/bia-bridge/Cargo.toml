[package]
name = "bia-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Talk to a bia from any agent (Claude Code, scripts): certificate request, live chat link, CLI and MCP server"

[[bin]]
name = "bia-bridge"
path = "src/main.rs"

[dependencies]
bia-pki = { path = "../bia-pki" }
bia-mcp = { path = "../bia-mcp" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
ring = "0.17"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
