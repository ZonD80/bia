[package]
name = "bia-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "bia: systemd service that is the mind of the machine"

[[bin]]
name = "bia-agent"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
libc.workspace = true
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "json",
] }
base64 = "0.22"
anyhow.workspace = true
regex = "1"
unicode-width = "0.1"
bia-pki = { path = "../bia-pki" }
bia-speech = { path = "../bia-speech" }
